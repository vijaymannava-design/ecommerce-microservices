server.port=8083
spring.application.name=order-service

# Database Setup
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_order?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Strategy
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/


# Kafka Producer Properties
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


# Force Netty to use standard JVM system DNS resolution instead of reactive internet DNS lookup
spring.cloud.gateway.dns-notifier.enabled=false
# If using standard Netty under the hood for WebClient
spring.netty.leak-detection=simple

spring.cloud.loadbalancer.ribbon.enabled=false

# Fixes NXDOMAIN by forcing the load balancer to look at Eureka first
spring.cloud.loadbalancer.zone=default
spring.cloud.loadbalancer.cache.enabled=true


# Resilience4j Circuit Breaker Configurations
resilience4j.circuitbreaker.instances.inventoryService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.inventoryService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.inventoryService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventoryService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.inventoryService.permittedNumberOfCallsInHalfOpenState=3



# Management Endpoints Exposure Config
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true

# Include extra application details for tracking
management.metrics.tags.application=${spring.application.name}


# Increase Eureka Client connection and read timeouts (values in milliseconds)
eureka.client.eureka-server-connect-timeout-seconds=10
eureka.client.eureka-server-read-timeout-seconds=10
