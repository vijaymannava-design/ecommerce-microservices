server.port=8081
spring.application.name=product-service

#Database COnfiguration
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_product?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# logging using slf4j and logback
logging.config=classpath:logback-spring.xml

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/




















eureka.client.eureka-server-connect-timeout-seconds=10
eureka.client.eureka-server-read-timeout-seconds=10
